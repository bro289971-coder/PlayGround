<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BLACKSITE // Tactical Arena</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b0c;font-family:"Arial Narrow","Roboto Condensed",Arial,sans-serif;user-select:none}canvas{display:block;width:100%;height:100%;background:#9ba7a2;cursor:crosshair}.hud{position:absolute;inset:0;color:#f2f4f0;pointer-events:none;text-shadow:0 2px 3px #000}.topbar{position:absolute;left:24px;right:24px;top:18px;display:flex;justify-content:space-between;align-items:flex-start}.brand{font-weight:900;font-size:18px;letter-spacing:3px}.brand b{color:#ffb000}.mission{margin-top:5px;font-size:11px;color:#c8cfca;letter-spacing:2px}.scorebox{text-align:right}.wave{font-size:13px;letter-spacing:3px}.kills{font-size:40px;font-weight:900;line-height:38px}.objective{position:absolute;top:76px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:2px;color:#fff}.objective i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff4b32;margin-right:8px}.crosshair{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%)}.crosshair:before,.crosshair:after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}.crosshair:before{width:18px;height:2px;top:8px}.crosshair:after{height:18px;width:2px;left:8px}.bottom{position:absolute;left:24px;right:24px;bottom:22px;display:flex;justify-content:space-between;align-items:flex-end}.health{width:230px}.healthrow{display:flex;align-items:end;gap:10px}.healthnum{font-size:48px;font-weight:900;line-height:44px}.healthlabel{font-size:10px;letter-spacing:3px;color:#d5d8d4;margin-bottom:5px}.bar{height:5px;background:#ffffff30;margin-top:8px}.barfill{height:100%;width:100%;background:#f1f3ef}.ammo{text-align:right}.ammomain{font-size:54px;font-weight:900;line-height:48px}.ammomain small{font-size:18px;color:#aeb5b0}.weapon{font-size:11px;letter-spacing:3px}.start,.gameover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,#111716cc 0%,#11171655 58%,#111716bb 100%);pointer-events:auto}.panel{width:min(560px,calc(100% - 40px));border-left:3px solid #ffb000;padding:26px 34px;background:#111716dd}.panel h1{margin:0;font-size:54px;line-height:.88;letter-spacing:-2px}.panel h1 span{color:#ffb000}.panel p{color:#bbc2bd;font-size:13px;letter-spacing:1px;line-height:1.7}.panel button{margin-top:10px;border:0;background:#ffb000;color:#111;font-weight:900;padding:16px 24px;letter-spacing:2px;cursor:pointer}.hidden{display:none}.damage{position:absolute;inset:0;border:0 solid #b52d20;pointer-events:none}.toast{position:absolute;left:50%;bottom:130px;transform:translateX(-50%);font-size:13px;letter-spacing:3px;color:#ffb000}.touch{display:none}.joystick{position:absolute;width:120px;height:120px;border:1px solid #ffffff20;border-radius:50%;pointer-events:auto}.stick{position:absolute;width:54px;height:54px;left:33px;top:33px;border-radius:50%;background:#ffffff18;border:1px solid #ffffff40}.firebtn{position:absolute;right:25px;bottom:28px;width:88px;height:88px;border-radius:50%;border:2px solid #ffffff55;background:#ff4b3238;pointer-events:auto;font-size:11px;font-weight:900;color:#fff;text-align:center;line-height:84px}.reloadbtn{position:absolute;right:125px;bottom:34px;width:58px;height:58px;border-radius:50%;border:1px solid #ffffff44;background:#111b1888;pointer-events:auto;font-size:9px;color:#fff;text-align:center;line-height:56px}@media(pointer:coarse),(max-width:800px){.touch{display:block}.health{width:150px}.healthnum{font-size:38px}.ammomain{font-size:42px}.topbar{left:12px;right:12px}.brand{font-size:14px}.bottom{left:14px;right:14px;bottom:12px}.joystick{left:18px;bottom:20px}.firebtn{right:18px}.reloadbtn{right:112px}.panel h1{font-size:42px}.toast{bottom:155px}}
</style></head>
<body>
<canvas id="c"></canvas>
<div class="hud"><div class="topbar"><div><div class="brand">BLACKSITE <b>//</b> 04</div><div class="mission">OPERATION COLD VEIL</div></div><div class="scorebox"><div class="wave">WAVE <span id="wave">01</span></div><div class="kills" id="kills">000</div></div></div><div class="objective"><i></i><span id="objective">CLEAR THE COMPOUND</span></div><div class="crosshair" id="crosshair"></div><div class="bottom"><div class="health"><div class="healthrow"><div class="healthnum" id="hp">100</div><div class="healthlabel">VITALS</div></div><div class="bar"><div class="barfill" id="hpbar"></div></div></div><div class="ammo"><div class="ammomain"><span id="ammo">30</span> <small>/ <span id="reserve">120</span></small></div><div class="weapon">VX-16 CARBINE</div></div></div><div class="damage" id="damage"></div><div class="toast" id="toast"></div></div>
<div class="start" id="start"><div class="panel"><h1>TACTICAL<br><span>BREACH</span></h1><p>WASD MOVE · MOUSE AIM · CLICK FIRE · R RELOAD<br>SURVIVE EVERY WAVE. NO EXTRACTION.</p><button id="play">DEPLOY</button></div></div>
<div class="gameover hidden" id="gameover"><div class="panel"><h1>MISSION<br><span>FAILED</span></h1><p>HOSTILES ELIMINATED: <b id="finalKills">0</b><br>WAVE REACHED: <b id="finalWave">1</b></p><button id="retry">REDEPLOY</button></div></div>
<div class="touch hidden" id="touch"><div class="joystick" id="joy"><div class="stick" id="stick"></div></div><div class="reloadbtn" id="reload">RELOAD</div><div class="firebtn" id="fire">FIRE</div></div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');let W,H,dpr;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
let started=false,gameover=false,keys={},mouse={x:0,y:0,down:false},yaw=0,pitch=0;
const player={x:0,z:7,a:0,hp:100,ammo:30,reserve:120,reload:0,firecd:0,inv:0};
let enemies=[],shots=[],kills=0,wave=1,spawnLeft=0,objectiveTime=0,flash=0;
const walls=[[-12,-16,24,1],[-12,16,24,1],[-16,-12,1,28],[16,-12,1,28],[-7,-8,1,9],[7,-4,1,12],[-3,5,10,1],[-10,8,5,1],[10,8,5,1]];
function reset(){enemies=[];shots=[];kills=0;wave=1;spawnLeft=5;player.x=0;player.z=12;player.hp=100;player.ammo=30;player.reserve=120;player.reload=0;player.firecd=0;yaw=0;pitch=0;gameover=false;updateHUD();document.getElementById('gameover').classList.add('hidden')}
function spawn(){let side=Math.floor(Math.random()*4),x,z;if(side<2){x=(side?1:-1)*(11+Math.random()*3);z=-9+Math.random()*18}else{x=-11+Math.random()*22;z=(side==2?-11:11)}enemies.push({x,z,hp:50+wave*8,spd:.018+wave*.002,a:0,hit:0,shoot:1+Math.random()*2})}
function updateHUD(){document.getElementById('hp').textContent=Math.max(0,Math.ceil(player.hp));document.getElementById('hpbar').style.width=Math.max(0,player.hp)+'%';document.getElementById('ammo').textContent=player.ammo;document.getElementById('reserve').textContent=player.reserve;document.getElementById('kills').textContent=String(kills).padStart(3,'0');document.getElementById('wave').textContent=String(wave).padStart(2,'0')}
function reload(){if(player.reload||player.ammo>=30||player.reserve<=0)return;player.reload=75;toast('RELOADING')}
function toast(t){const e=document.getElementById('toast');e.textContent=t;clearTimeout(e.t);e.t=setTimeout(()=>e.text='',1500)}
function fire(){if(!started||gameover||player.firecd>0||player.reload)return;if(player.ammo<=0){reload();return}player.ammo--;player.firecd=9;flash=5;shots.push({x:player.x,z:player.z,a:0,life:8});updateHUD();const cx=W/2,cy=H/2;let best=null,bestd=999;for(const e of enemies){let dx=e.x-player.x,dz=e.z-player.z,dist=Math.hypot(dx,dz),ang=(Math.atan2(dx,dz)-yaw+Math.PI*3)%(Math.PI*2)-Math.PI;if(Math.abs(ang)<.09/(1+dist*.025)&&dist<bestd){best=e;bestd=dist}}if(best){best.hp-=34+Math.random()*16;best.hit=5;if(best.hp<=0){enemies.splice(enemies.indexOf(best),1);kills++}updateHUD()}}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLower=='r')reload()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
addEventListener('mousemove',e=>{if(started&&!gameover&&!document.pointerLockElement){yaw+=(e.movementX||0)*.0022;pitch=Math.max(-.45,Math.min(.45,pitch+(e.movementY||0)*.0018))}else if(started){yaw+=e.movementX*.0022;pitch=Math.max(-.45,Math.min(.45,pitch+e.movementY*.0018))}});c.addEventListener('mousedown',()=>{if(started)c.requestPointerLock(),mouse.down=true,fire()});addEventListener('mouseup',()=>mouse.down=false);
const joy=document.getElementById('joy'),stick=document.getElementById('stick');let joyId=null,jx=0,jz=0,lookId=null,lookX=0,lookY=0;
joy.addEventListener('touchstart',e=>{joyId=e.changedTouches[0].identifier},{passive:false});joy.addEventListener('touchmove',e=>{for(const t of e.changedTouches){if(t.identifier==joyId){let r=joy.getBoundingRect(),dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2),m=Math.min(40,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);jx=Math.cos(a)*m/40;jz=Math.sin(a)*m/40;stick.style.transform=`translate(${Math.cos(a)*m}px,${Math.sin(a)*m}px)`}}e.preventDefault()},{passive:false});joy.addEventListener('touchend',()=>{joyId=null;jx=jz=0;stick.style.transform=''},{passive:false});
c.addEventListener('touchstart',e=>{if(e.touches.length){let t=e.touches[e.touches.length-1];lookId=t.identifier;lookX=t.clientX;lookY=t.clientY}},{passive:false});c.addEventListener('touchmove',e=>{for(const t of e.touches){if(t.identifier==lookId){yaw+=(t.clientX-lookX)*.006;pitch=Math.max(-.45,Math.min(.45,pitch+(t.clientY-lookY)*.004));lookX=t.clientX;lookY=t.clientY}}e.preventDefault()},{passive:false});
document.getElementById('fire').addEventListener('touchstart',e=>{mouse.down=true;fire();e.preventPreventDefault()},{passive:false});addEventListener('touchend',()=>mouse.down=false);document.getElementById('reload').addEventListener('touchstart',e=>{reload();e.preventDefault()},{passive:false});
document.getElementById('play').onclick=()=>{document.getElementById('start').classList.add('hidden');document.getElementById('touch').classList.remove('hidden');started=true;reset();c.requestPointerLock?.()};document.getElementById('retry').onclick=()=>{started=true;reset();document.getElementById('touch').classList.remove('hidden')};
function collides(x,z){if(x< -14||x>14||z< -14||z>14)return true;for(const w of walls)if(x>w[0]&&x<w[0]+w[2]&&z>w[1]&&z<w[1]+w[3])return true;return false}
function update(){if(!started||gameover)return;if(spawnLeft>0&&enemies.length<Math.min(2+wave,8)){if(Math.random()<.018){spawn();spawnLeft--}}if(spawnLeft===0&&enemies.length===0){objectiveTime++;if(objectiveTime>180){wave++;spawnLeft=4+wave*2;objectiveTime=0;player.reserve=Math.min(180,player.reserve+45);player.hp=Math.min(100,player.hp+12);toast('WAVE '+String(wave).padStart(2,'0'))}document.getElementById('objective').textContent='WAVE CLEARED'}else document.getElementById('objective').textContent='CLEAR THE COMPOUND';let f=(keys.w?1:0)-(keys.s?1:0)+(jz<-.15?-jz:0)-(jz>.15?jz:0),s=(keys.d?1:0)-(keys.a?1:0)+jx;let sp=.09;if(keys.shift)sp=.14;let nx=player.x+(Math.sin(yaw)*f+Math.cos(yaw)*s)*sp,nz=player.z+(Math.cos(yaw)*f-Math.sin(yaw)*s)*sp;if(!collides(nx,player.z))player.x=nx;if(!collides(player.x,nz))player.z=nz;if(player.firecd>0)player.firecd--;if(player.reload>0){player.reload--;if(player.reload===0){let n=Math.min(30-player.ammo,player.reserve);player.ammo+=n;player.reserve-=n;updateHUD()}}if(player.inv>0)player.inv--;if(mouse.down&&player.firecd===0)fire();if(flash>0)flash--;for(const e of enemies){let dx=player.x-e.x,dz=player.z-e.z,d=Math.hypot(dx,dz);e.a=Math.atan2(dx,dz);if(d>2){let ex=e.x+(dx/d)*e.spd,ez=e.z+(dz/d)*e.spd;if(!collides(ex,e.z))e.x=ex;if(!collides(e.x,ez))e.z=ez}else if(e.shoot>0)e.shoot-=1/60;if(d<7&&e.shoot<=0){e.shoot=1.2+Math.random()*1.5;if(player.inv<=0){player.hp-=7+wave*1.2;player.inv=18;document.getElementById('damage').style.borderWidth='18px';setTimeout(()=>document.getElementById('damage').style.borderWidth='0',90);updateHUD();if(player.hp<=0){gameover=true;document.exitPointerLock?.();document.getElementById('finalKills').textContent=kills;document.getElementById('finalWave').textContent=wave;document.getElementById('gameover').classList.remove('hidden');document.getElementById('touch').classList.add('hidden')}}}}if(e.hit>0)e.hit--}
function project(x,z){let dx=x-player.x,dz=z-player.z,cs=Math.cos(-yaw),sn=Math.sin(-yaw),rx=dx*cs-dz*sn,rz=dx*sn+dz*cs;if(rz<=.1)return null;let sy=Math.sin(pitch)*H*.45,fov=W*.72;return{x:W/2+(rx/rz)*fov,y:H/2+sy-(H*.5/rz)+H*.08,w:fov/rz,h:H*.5/rz}}
function poly(a,b,top,bottom,color){ctx.beginPath();ctx.moveTo(a.x,top-a.h*.1);ctx.lineTo(b.x,top-b.h*.1);ctx.lineTo(b.x,bottom+b.h*.1);ctx.lineTo(a.x,bottom+a.h*.1);ctx.closePath();ctx.fillStyle=color;ctx.fill()}
function draw(){ctx.fillStyle='#9daaa5';ctx.fillRect(0,0,W,H);let horizon=H/2+Math.sin(pitch)*H*.45;let sky=ctx.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,'#263636');sky.addColorStop(1,'#aeb8b2');ctx.fillStyle=sky;ctx.fillRect(0,0,W,horizon);ctx.fillStyle='#505a55';ctx.fillRect(0,horizon,W,H-horizon);
// ground grid
ctx.strokeStyle='#657066';ctx.globalAlpha=.55;for(let i=-14;i<=14;i+=2){let a=project(-14,i),b=project(14,i);if(a&&b){ctx.beginPath();ctx.moveTo(a.x,horizon+a.y-horizon);ctx.lineTo(b.x,horizon+b.y-horizon);ctx.stroke()} }ctx.globalAlpha=1;
let items=[];for(const w of walls)items.push({type:'wall',d:Math.hypot(w[0]+w[2]/2-player.x,w[1]+w[3]/2-player.z),w});for(const e of enemies)items.push({type:'enemy',d:Math.hypot(e.x-player.x,e.z-player.z),e});items.sort((a,b)=>b.d-a.d);
for(const it of items){if(it.type==='wall'){let w=it.w,a=project(w[0],w[1]),b=project(w[0]+w[2],w[1]),c1=project(w[0]+w[2],w[1]+w[3]),d=project(w[0],w[1]+w[3]);if(a&&b&&c1&&d){ctx.fillStyle='#5d625c';ctx.beginPath();ctx.moveTo(a.x,a.y-a.h*.35);ctx.lineTo(b.x,b.y-b.h*.35);ctx.lineTo(c1.x,c1.y+c1.h*.35);ctx.lineTo(d.x,d.y+d.h*.35);ctx.fill();ctx.strokeStyle='#343936';ctx.lineWidth=2;ctx.stroke()} }else{let e=it.e,p=project(e.x,e.z);if(p){let size=Math.min(H*.55,180/p.rz||180);let top=p.y-size*.65,bottom=p.y+size*.35;ctx.fillStyle=e.hit?'#dcd6c5':'#4a5651';ctx.fillRect(p.x-size*.2,top+size*.12,size*.4,size*.65);ctx.fillStyle=e.hit?'#f5efde':'#9da7a0';ctx.beginPath();ctx.arc(p.x,top+size*.18,size*.17,0,7);ctx.fill();ctx.fillStyle='#242826';ctx.fillRect(p.x-size*.26,top+size*.42,size*.52,size*.08);ctx.fillStyle='#d1aa58';ctx.fillRect(p.x-size*.08,bottom-size*.02,size*.16,2)}}}
// weapon
let bob=(keys.w||keys.s||keys.a||keys.d)?Math.sin(performance.now()/90)*5:0;ctx.fillStyle='#171d1b';ctx.beginPath();ctx.moveTo(W*.56,H*.84+bob);ctx.lineTo(W*.46,H+bob);ctx.lineTo(W*.68,H+bob);ctx.lineTo(W*.63,H*.68+bob);ctx.fill();ctx.fillStyle='#3d4642';ctx.fillRect(W*.54,H*.70+bob,W*.12,H*.25);ctx.fillStyle='#111';ctx.fillRect(W*.57,H*.64+bob,W*.07,H*.12);if(flash){ctx.fillStyle='#ffc34a';ctx.beginPath();ctx.moveTo(W*.50,H*.65);ctx.lineTo(W*.58,H*.48);ctx.lineTo(W*.66,H*.65);ctx.fill()}
if(mouse.down&&started&&!gameover)ctx.fillStyle='#ffb00055';
requestAnimationFrame(loop)}
function loop(){update();draw()}loop();
</script>
</body></html>
